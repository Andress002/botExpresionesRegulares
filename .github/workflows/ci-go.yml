name: Pipeline de Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno de Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22.2'

    - name: Instalar dependencias
      run: go mod download

    - name: Compilar proyecto
      run: go build -v ./...
